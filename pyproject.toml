[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lecflow"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "spacy", 
    "click", 
    "pandas", 
    "joblib", 
    "scikit-learn", 
    "matplotlib", 
    "sentence-transformers", 
    "sqlalchemy", 
    "streamlit", 
    "faster-whisper",
    "ollama",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "SIM"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
