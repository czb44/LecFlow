[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lecflow"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "spacy", 
    "click", 
    "pandas", 
    "joblib", 
    "scikit-learn", 
    "matplotlib", 
    "sentence-transformers", 
    "sqlalchemy", 
    "streamlit", 
    "faster-whisper", 
    "pytest"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
