repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff linting
        entry: ruff check --fix .
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: Ruff formatting
        entry: ruff format .
        language: system
        pass_filenames: false
        types: [python]
      
      - id: mypy
        name: mypy type checking
        entry: mypy src
        language: system
        pass_filenames: false
        types: [python]
